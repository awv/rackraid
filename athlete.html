<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athlete Profile - Rack Raid Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <script src="site-layout.js"></script>
    <script src="data/course_records.js"></script>
    <style>
        .scenic-gradient-overlay {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.4) 0%, rgba(15, 23, 42, 0.8) 60%, rgba(2, 6, 23, 1) 100%);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 50px;
        }
        .stat-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.01);
            transition: border-color 0.15s ease;
        }
        .stat-card:hover { border-color: #475569; }
        .stat-value { font-size: 2.2rem; font-weight: 800; color: #f8fafc; margin-bottom: 3px; letter-spacing: -0.5px; }
        .stat-label { font-size: 0.8rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Desktop Grid Rules */
        .history-block { background: #1e293b; border: 1px solid #334155; border-radius: 6px; overflow: hidden; }
        .history-header { 
            display: grid; 
            grid-template-columns: 8% 12% 28% 15% 7% 13% 17%; 
            background-color: #0f172a; 
            font-weight: 600; 
            color: #94a3b8; 
            border-bottom: 2px solid #334155; 
            padding: 12px 14px; 
            font-size: 0.85rem;
        }
        .history-row { 
            display: grid; 
            grid-template-columns: 8% 12% 28% 15% 7% 13% 17%; 
            padding: 14px; 
            border-bottom: 1px solid #334155; 
            align-items: center; 
            color: #cbd5e1; 
        }
        .history-row:last-child { border-bottom: none; }
        .history-row:nth-child(even) { background-color: #161e2e; }
        .text-right { text-align: right; }
        .pace-column { text-align: right; line-height: 1.3; }
        .badge-win { background-color: rgba(16, 185, 129, 0.12); border-left: 4px solid #10b981; }
        .record-tag { background-color: #064e3b; color: #34d399; font-weight: bold; padding: 2px 6px; border-radius: 4px; font-size: 0.9rem; border: 1px solid rgba(52, 211, 153, 0.2); }
        .athlete-desktop-table-row { display: contents; }

        /* Mobile Viewport Custom Layout Architecture */
        @media screen and (max-width: 768px) {
            /* Reduce black space gap under profile card and pull elements up */
            .w-full.bg-slate-950.min-h-\[400px\] {
                min-height: auto !important;
                padding-top: 2rem !important;
                padding-bottom: 1.5rem !important;
            }
            .page-wrapper {
                padding-top: 0.5rem !important;
            }
            
            /* Force the profile stat metrics cards to display exactly 2 across on mobile screen sizes */
            .stats-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 12px !important;
                margin-bottom: 24px !important;
            }
            .stat-card {
                padding: 16px 12px !important;
            }
            .stat-value {
                font-size: 1.75rem !important;
            }
            .stat-label {
                font-size: 0.7rem !important;
            }

            .history-header { 
                display: none; 
            }
            .history-row { 
                display: flex; 
                flex-direction: column;
                padding: 16px; 
                border-bottom: 1px solid #334155; 
            }
            .history-row > div {
                width: 100%;
                text-align: left;
            }
            .pace-column { 
                text-align: right; 
            }
            .athlete-desktop-table-row { 
                display: flex; 
                flex-direction: column; 
                gap: 8px; 
            }
        }
    </style>
</head>
<body class="bg-slate-950 min-h-screen flex flex-col text-slate-100">

    <div class="w-full bg-slate-900 border-b border-slate-800">
        <header id="global-header" class="text-white"></header>
    </div>

    <div class="w-full bg-slate-950 min-h-[400px] py-12 relative overflow-hidden flex items-center">
        <img src="assets/images/banners/default_stage.jpg" class="absolute inset-0 w-full h-full object-cover opacity-55 mix-blend-luminosity brightness-75" alt="Stage background">
        <img src="assets/images/banners/default_stage.jpg" class="absolute inset-0 w-full h-full object-cover opacity-35 mix-blend-luminosity brightness-75" alt="Stage background">
        <div class="absolute inset-0 scenic-gradient-overlay"></div>
        
        <div class="max-w-[1400px] mx-auto w-full px-4 relative z-10 flex flex-col md:flex-row items-center gap-8">
            <div id="photoWrapper" class="shrink-0 hidden">
                <img id="athletePhoto" class="w-[220px] h-[280px] border-2 border-white/20 rounded-xl object-cover shadow-2xl" src="" alt="Runner">
            </div>
            
            <div class="flex flex-col justify-center text-center md:text-left flex-grow w-full">
                <div class="flex flex-col md:flex-row items-center gap-4 mb-4 justify-center md:justify-start flex-wrap">
                    <h1 id="athleteName" class="text-white font-black text-3xl md:text-5xl uppercase tracking-tight leading-none m-0 break-words max-w-full">-</h1>
                    <div id="athleteClub" class="text-sm font-bold uppercase tracking-wider px-3 py-1 rounded-md text-white bg-slate-800 border border-slate-700 w-max shrink-0">-</div>
                </div>
                <div id="athleteInsightsContainer" class="flex flex-col gap-3 w-full"></div>
            </div>
        </div>
    </div>

    <div class="page-wrapper flex-grow pt-8">
        <div class="content-container">

            <main class="main-profile-container">
                
                <div class="stats-grid">
                    <div class="stat-card">
                        <div id="statAppearances" class="stat-value">0</div>
                        <div class="stat-label">Stages Run</div>
                    </div>
                    <div class="stat-card">
                        <div id="statWins" class="stat-value">0</div>
                        <div class="stat-label">Stage Wins</div>
                    </div>
                    <div class="stat-card">
                        <div id="statHighest" class="stat-value">-</div>
                        <div class="stat-label">Highest Position</div>
                    </div>
                    <div class="stat-card">
                        <div id="statRecords" class="stat-value">0</div>
                        <div class="stat-label">Records Broken</div>
                    </div>
                </div>

                <h2 class="text-xl font-black uppercase tracking-tight text-slate-100 mb-4">Race History</h2>
                <div class="history-block">
                    <div class="history-header">
                        <div>Year</div>
                        <div>Stage</div>
                        <div>Course Leg Info</div>
                        <div>Club</div>
                        <div class="text-right">Pos</div>
                        <div class="text-right">Time</div>
                        <div class="text-right">Pace</div>
                    </div>
                    <div id="historyRowsContainer"></div>
                </div>

            </main>
        </div>
    </div>

    <footer id="global-footer" class="bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800"></footer>

    <script src="data.js"></script>
    <script>
        const stageNames = {
            1: "Grosmont to Skenfrith", 2: "Skenfrith to White Castle", 3: "White Castle to Abergavenny",
            4: "Abergavenny to Old Court Moat", 5: "Old Court Moat to Monmouth", 6: "Monmouth to Raglan",
            7: "Raglan to Usk", 8: "Usk to Tintern", 9: "Tintern to Chepstow", 10: "Chepstow to Caldicot",
            11: "Caldicot to Penhow", 12: "Penhow to Caerleon", 13: "Caerleon to Castell-y-Bwch",
            14: "Castell-y-Bwch to Olive Tree"
        };

        const courseRecords = {
            "2026": {"1":"00:31:14","2":"00:38:40","3":"00:43:25","4":"00:36:12","5":"00:41:20","6":"00:33:15","7":"00:39:45","8":"00:42:10","9":"00:35:50","10":"00:38:15","11":"00:40:05","12":"00:37:20","13":"00:44:10","14":"00:31:55"},
            "2025": {"1":"00:34:14","2":"00:39:15","3":"00:44:50","4":"00:37:00","5":"00:42:55","6":"00:34:20","7":"00:41:00","8":"00:43:40","9":"00:36:45","10":"00:39:30","11":"00:41:20","12":"00:38:50","13":"00:45:30","14":"00:32:40"},
            "2024": {"1":"00:35:40","2":"00:40:20","3":"00:45:12","4":"00:38:10","5":"00:43:15","6":"00:35:05","7":"00:42:15","8":"00:44:55","9":"00:37:30","10":"00:40:45","11":"00:42:50","12":"00:39:15","13":"00:46:20","14":"00:33:10"}
        };

        const clubColorsMaster = {
            "aberdare": { text: "#F49931", bg: "#000400", border: "rgba(244, 153, 49, 0.3)" },
            "albany road": { text: "#000000", bg: "#FB24A3", border: "rgba(0, 0, 0, 0.2)" },
            "brackla harriers": { text: "#FFBA36", bg: "#FF0005", border: "rgba(255, 186, 54, 0.3)" },
            "builth & district rc": { text: "#000000", bg: "#FCFA3A", border: "rgba(0, 0, 0, 0.2)" },
            "caerleon rc": { text: "#ffffff", bg: "#4C1B60", border: "rgba(0, 0, 0, 0.2)" },
            "caerphilly runners": { text: "#000000", bg: "#5A98DD", border: "rgba(0, 0, 0, 0.2)" },
            "caldicot rc": { text: "#ffffff", bg: "#040503", border: "rgba(255, 255, 255, 0.3)" },
            "cdf runners": { text: "#ffffff", bg: "#292221", border: "rgba(255, 255, 255, 0.3)" },
            "chepstow harriers": { text: "#C4B605", bg: "#5A9BD4", border: "rgba(196, 182, 5, 0.4)" },
            "cornelly striders": { text: "#B96F01", bg: "#FFED00", border: "rgba(185, 111, 1, 0.4)" },
            "fairwater runners": { text: "#142241", bg: "#8EB1EA", border: "rgba(20, 34, 65, 0.3)" },
            "griffithstown harriers": { text: "#ffffff", bg: "#05683B", border: "rgba(255, 255, 255, 0.3)" },
            "islwyn rc": { text: "#ffffff", bg: "#040002", border: "rgba(255, 255, 255, 0.3)" },
            "les croupiers rc": { text: "#ffffff", bg: "#01B240", border: "rgba(255, 255, 255, 0.3)" },
            "lliswerry runners": { text: "#ffffff", bg: "#AB0851", border: "rgba(255, 255, 255, 0.3)" },
            "monross trailblazers": { text: "#ffffff", bg: "#B36927", border: "rgba(255, 255, 255, 0.3)" },
            "neath harriers": { text: "#ffffff", bg: "#000000", border: "rgba(255, 255, 255, 0.3)" },
            "ogmore phoenix runners": { text: "#ffffff", bg: "#B36927", border: "rgba(255, 255, 255, 0.3)" },
            "parc bryn bach rc": { text: "#978430", bg: "#03632A", border: "rgba(151, 132, 48, 0.4)" },
            "pegasus rc": { text: "#ffffff", bg: "#4A90E2", border: "rgba(255, 255, 255, 0.3)" },
            "pont-y-pwl & district runners": { text: "#ffffff", bg: "#E41F4C", border: "rgba(255, 255, 255, 0.3)" },
            "pontyclun road runners": { text: "#E4CC60", bg: "#5C67A0", border: "rgba(228, 204, 96, 0.4)" },
            "pontypridd roadents": { text: "#ffffff", bg: "#000000", border: "rgba(255, 255, 255, 0.3)" },
            "porthcawl runers": { text: "#ffffff", bg: "#000000", border: "rgba(255, 255, 255, 0.3)" },
            "rhondda valley runners": { text: "#ffffff", bg: "#C3121F", border: "rgba(255, 255, 255, 0.3)" },
            "san domenico rc": { text: "#E32335", bg: "#100D1A", border: "rgba(227, 35, 53, 0.3)" },
            "spirit of monmouth": { text: "#C8B506", bg: "#034CAD", border: "rgba(200, 181, 6, 0.4)" },
            "independent": { text: "#4b5563", bg: "#f3f4f6", border: "#e5e7eb" }
        };

        const defTimeToSeconds = (tStr) => {
            if (!tStr) return 0;
            const p = tStr.split(':');
            return parseInt(p[0],10) * 3600 + parseInt(p[1],10) * 60 + parseInt(p[2],10);
        };

        const formatPaceValue = (totalSeconds, distance) => {
            if (!distance || totalSeconds <= 0) return "-";
            const paceSecs = Math.round(totalSeconds / distance);
            const mins = Math.floor(paceSecs / 60);
            const secs = paceSecs % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        };

        const cleanClubName = (rawString) => {
            if (!rawString) return "Independent";
            let val = rawString.toString().trim();
            val = val.replace(/\s*\(\d+\)\s*$/, '').trim();
            let matchKey = val.toLowerCase();
            
            if (matchKey.includes('chepstow')) return 'Chepstow Harriers';
            if (matchKey.includes('parc')) return 'Parc Bryn Bach RC';
            if (matchKey.includes('pont-y-pwl') || matchKey.includes('pontypool')) return 'Pont-y-pwl & District Runners';
            if (matchKey.includes('liswerry') || matchKey.includes('lliswerry')) return 'Lliswerry Runners';
            if (matchKey.includes('caerleon')) return 'Caerleon RC';
            if (matchKey.includes('caerphilly')) return 'Caerphilly Runners';
            if (matchKey.includes('caldicot')) return 'Caldicot RC';
            if (matchKey.includes('cdf')) return 'CDF Runners';
            if (matchKey.includes('griffithstown')) return 'Griffithstown Harriers';
            if (matchKey.includes('islwyn')) return 'Islwyn RC';
            if (matchKey.includes('les croupiers') || matchKey.includes('croupiers')) return 'Les Croupiers RC';
            if (matchKey.includes('monross')) return 'Monross Trailblazers';
            if (matchKey.includes('neath')) return 'Neath Harriers';
            if (matchKey.includes('ogmore')) return 'Ogmore Phoenix Runners';
            if (matchKey.includes('pontyclun')) return 'Pontyclun Road Runners';
            if (matchKey.includes('pontypridd')) return 'Pontypridd Roadents';
            if (matchKey.includes('porthcawl')) return 'Porthcawl Runers';
            if (matchKey.includes('rhondda')) return 'Rhondda Valley Runners';
            if (matchKey.includes('san domenico')) return 'San Domenico RC';
            if (val === '-' || matchKey === 'individual' || matchKey === 'unattached') return 'Independent';
            return val;
        };

        function generateAthleteBadges(athleteResults) {
            const badges = [];
            const totalRuns = athleteResults.length;
            
            const uniqueStages = [...new Set(athleteResults.map(r => parseInt(r.stage)))];
            const uniqueYears = [...new Set(athleteResults.map(r => parseInt(r.year)))];
            
            const positions = athleteResults.map(r => parseInt(r.position) || 999);
            const bestPos = Math.min(...positions);

            const buildBadge = (label, tooltipText, colorClasses) => {
                return `
                    <div class="group relative inline-block select-none">
                        <span class="cursor-help text-xs font-bold uppercase tracking-wider px-2.5 py-1 rounded-md border ${colorClasses}">
                            ${label}
                        </span>
                        <div class="pointer-events-none absolute top-full left-1/2 -translate-x-1/2 mt-2 w-48 scale-95 opacity-0 group-hover:scale-100 group-hover:opacity-100 transition-all duration-100 bg-slate-900 text-slate-200 text-[11px] font-medium p-2 rounded-md border border-slate-700 shadow-xl z-30 text-center leading-normal">
                            ${tooltipText}
                            <div class="absolute bottom-full left-1/2 -translate-x-1/2 border-4 border-transparent border-b-slate-900"></div>
                        </div>
                    </div>
                `;
            };

            if (totalRuns >= 5) {
                badges.push(buildBadge("🏆 Rack Raid Veteran", "Completed 5 or more Rack Raid stages over their career", "bg-amber-500/10 text-amber-400 border-amber-500/20"));
            } else if (uniqueYears.length >= 2) {
                badges.push(buildBadge("🔄 Loyal Competitor", "Returned to compete in multiple editions of the relay", "bg-blue-500/10 text-blue-400 border-blue-500/20"));
            }

            if (bestPos === 1) {
                badges.push(buildBadge("⚡ Stage Winner", "Claimed an outright individual stage victory", "bg-emerald-500/10 text-emerald-400 border-emerald-500/20"));
            } else if (bestPos <= 3) {
                badges.push(buildBadge("🥈 Podium Finisher", "Finished on the individual stage podium (Top 3)", "bg-slate-300/10 text-slate-200 border-slate-300/20"));
            } else if (bestPos <= 10) {
                badges.push(buildBadge("🎯 Top 10 Finisher", "Secured a top-10 individual finish on a stage", "bg-purple-500/10 text-purple-400 border-purple-500/20"));
            }

            if (uniqueStages.length >= 3) {
                badges.push(buildBadge("🗺️ Stage Veteran", "Has raced on 3 or more completely distinct stages of the course", "bg-pink-500/10 text-pink-400 border-pink-500/20"));
            }

            return badges.join('\n');
        }

        function getMostFrequentedStage(athleteResults, stageNames) {
            if (athleteResults.length === 0) return null;
            
            const counts = {};
            athleteResults.forEach(r => {
                counts[r.stage] = (counts[r.stage] || 0) + 1;
            });

            let mostFrequentedStageId = Object.keys(counts).reduce((a, b) => counts[a] > counts[b] ? a : b);
            let maxCount = counts[mostFrequentedStageId];

            if (maxCount > 1) {
                const name = stageNames[mostFrequentedStageId] || `Stage ${mostFrequentedStageId}`;
                return {
                    stageId: mostFrequentedStageId,
                    name: name,
                    count: maxCount
                };
            }
            return null;
        }

        const urlParams = new URLSearchParams(window.location.search);
        const rawUrlName = urlParams.get('name');

        if (rawUrlName) {
            const targetName = rawUrlName.replace(/\s*\([MF]\d*\)\s*$/i, '').trim();
            document.title = `${targetName} - Athlete Profile`;
            document.getElementById('athleteName').textContent = targetName;

            const photoFileName = targetName.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-') + '.jpg';
            const imgElement = document.getElementById('athletePhoto');
            const wrapper = document.getElementById('photoWrapper');
            
            imgElement.src = `assets/images/athletes/${photoFileName}`;
            imgElement.onload = function() {
                wrapper.classList.remove('hidden');
            };
            imgElement.onerror = function() {
                wrapper.remove();
            };

            const runnerHistory = relayResults.filter(row => {
                const cleanRowName = row.name.replace(/\s*\([MF]\d*\)\s*$/i, '').trim();
                return cleanRowName.toLowerCase() === targetName.toLowerCase();
            }).sort((a, b) => b.year - a.year || a.stage - a.stage);

            if (runnerHistory.length > 0) {
                let primaryClub = cleanClubName(runnerHistory[0].club);
                const clubTargetElement = document.getElementById('athleteClub');
                clubTargetElement.innerHTML = `<a href="club.html?club=${encodeURIComponent(primaryClub)}" class='text-white hover:underline'>${primaryClub}</a>`;

                const clubKey = primaryClub.toLowerCase().trim();
                if (clubColorsMaster[clubKey]) {
                    clubTargetElement.style.borderColor = clubColorsMaster[clubKey].bg;
                }

                const badgesHTML = generateAthleteBadges(runnerHistory);
                const frequented = getMostFrequentedStage(runnerHistory, stageNames);

                let insightsHTML = `
                    <div class="flex flex-wrap gap-2 mb-6 justify-center md:justify-start">
                        ${badgesHTML || '<span class="text-xs text-slate-500 italic">No historical badges unlocked yet</span>'}
                    </div>
                `;

                if (frequented) {
                    insightsHTML += `
                        <div class="bg-slate-900/50 border border-slate-800/60 backdrop-blur-sm rounded-lg p-3 text-sm max-w-md mx-auto md:mx-0 text-left">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block mb-1">Favourite Stomping Ground</span>
                            <p class="text-slate-200 m-0 leading-tight">
                                Regularly selected for <a href="stage.html?stage=${frequented.stageId}" class="text-emerald-400 hover:underline font-bold">${frequented.name}</a>, clocking up <span class="text-white font-black">${frequented.count}</span> career appearances.
                            </p>
                        </div>
                    `;
                }

                document.getElementById('athleteInsightsContainer').innerHTML = insightsHTML;

                let wins = 0, recordsBroken = 0, highestPos = 999, htmlOutput = '';

                runnerHistory.forEach(row => {
                    if (row.position === 1) wins++;
                    if (row.position < highestPos) highestPos = row.position;

                    const standingRecord = courseRecords[row.year.toString()] ? courseRecords[row.year.toString()][row.stage.toString()] : null;
                    const runSeconds = defTimeToSeconds(row.time);
                    const brokeRecord = standingRecord && runSeconds <= defTimeToSeconds(standingRecord);
                    if (brokeRecord) recordsBroken++;

                    const specificYearClub = cleanClubName(row.club);
                    const milePace = formatPaceValue(runSeconds, row.miles);
                    const kmPace = formatPaceValue(runSeconds, row.km);
                    
                    let rowClass = row.position === 1 ? 'history-row badge-win' : 'history-row';
                    let timeDisplay = brokeRecord ? `<span class="record-tag">${row.time}</span>` : row.time;

                    htmlOutput += `
                        <div class="${rowClass}">
                            <div class="athlete-desktop-table-row">
                                <!-- Year -->
                                <div class="flex justify-between items-baseline md:block border-b border-slate-700/50 md:border-none pb-2 md:pb-0 mb-2 md:mb-0">
                                    <span class="text-slate-500 font-bold text-xs uppercase md:hidden">Year</span>
                                    <span class="text-slate-100 font-bold">${row.year}</span>
                                </div>

                                <!-- Stage Number -->
                                <div class="text-emerald-400 font-semibold md:text-slate-400 md:font-medium text-sm md:text-base mb-1 md:mb-0">
                                    <span class="md:hidden">Stage </span>${row.stage}
                                </div>

                                <!-- Leg Details -->
                                <div class="mb-2 md:mb-0">
                                    <a href="index.html?year=${row.year}&stage=${row.stage}" class="text-slate-100 hover:text-emerald-400 no-underline inline-block border-b border-dashed border-slate-600 pb-0.5">
                                        ${row.stage_name || 'Leg Details'}
                                    </a>
                                </div>

                                <!-- Club -->
                                <div class="truncate pr-2 mb-4 md:mb-0">
                                    <span class="text-[10px] text-slate-500 font-bold uppercase block md:hidden mb-0.5">Club</span>
                                    <a href="club.html?club=${encodeURIComponent(specificYearClub)}" class="text-slate-300 hover:text-emerald-400 font-semibold md:font-normal text-xs transition-colors no-underline">
                                        ${specificYearClub}
                                    </a>
                                </div>

                                <!-- Position -->
                                <div class="flex justify-between items-center md:block bg-slate-900 md:bg-transparent p-2 md:p-0 rounded-t-md md:rounded-none border-b border-slate-800 md:border-none px-3 md:px-0">
                                    <span class="text-[10px] text-slate-500 font-bold uppercase md:hidden">Position</span>
                                    <span class="md:text-right block font-bold text-slate-100">${row.position}</span>
                                </div>

                                <!-- Time -->
                                <div class="flex justify-between items-center md:block bg-slate-900 md:bg-transparent p-2 md:p-0 border-b border-slate-800 md:border-none px-3 md:px-0">
                                    <span class="text-[10px] text-slate-500 font-bold uppercase md:hidden">Time</span>
                                    <span class="md:text-right block font-medium">${timeDisplay}</span>
                                </div>

                                <!-- Pace -->
                                <div class="flex justify-between items-center md:block bg-slate-900 md:bg-transparent p-2 md:p-0 rounded-b-md md:rounded-none px-3 md:px-0 text-right md:text-left">
                                    <span class="text-[10px] text-slate-500 font-bold uppercase md:hidden">Pace</span>
                                    <div class="pace-column text-right md:text-left">
                                        <strong>${milePace}</strong> <span class="text-xs text-slate-500">/mi</span>
                                        <span class="block text-[11px] text-slate-400 font-normal mt-0.5 md:hidden">${kmPace} /km</span>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                });

                document.getElementById('statAppearances').textContent = runnerHistory.length;
                document.getElementById('statWins').textContent = wins;
                document.getElementById('statHighest').textContent = highestPos === 999 ? '-' : highestPos;
                document.getElementById('statRecords').textContent = recordsBroken;
                document.getElementById('historyRowsContainer').innerHTML = htmlOutput;
            }
        }
    </script>
</body>
</html>
