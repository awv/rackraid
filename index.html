<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rack Raid Results Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="site-layout.js"></script>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
</head>
<body class="home-archive-page bg-slate-950 min-h-screen flex flex-col">

    <div class="w-full bg-slate-900 border-b border-slate-800 sticky top-0 h-16 z-[100] flex items-center">
        <header id="global-header" class="w-full bg-slate-900 border-b border-slate-800"></header>
    </div>

    <div class="w-full flex-grow py-12 px-6 relative">
        <img src="assets/images/banners/default_stage.jpg" class="absolute inset-0 w-full h-full object-cover opacity-15 brightness-50 contrast-125 mix-blend-luminosity pointer-events-none" alt="">
        
        <div class="max-w-[1400px] mx-auto w-full relative z-10">
            
            <div class="text-center mb-10">
                <h2 class="text-white font-black text-4xl md:text-5xl uppercase tracking-tight leading-none mb-4">Rack Raid Archive</h2>
                <p class="text-slate-400 font-medium text-sm md:text-base max-w-2xl mx-auto leading-relaxed">
                    Explore historical relay datasets, track route variations, and search all-time course benchmarks across the traditional 14-stage circuit.
                </p>
                <div class="mt-6">
                    <a href="stats.html" class="inline-flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white border border-slate-800 text-xs font-semibold px-5 py-2.5 rounded-full transition-all">
                        📊 View All-Time Records & Stats
                    </a>
                </div>
            </div>

            <div class="search-panel">
                <div class="flex flex-col md:flex-row gap-3 w-full mb-6">
                    <input type="text" id="searchQuery" placeholder="Search your name, teammate, or club..." class="w-full md:flex-1">
                    
                    <div class="flex gap-3 w-full md:w-auto md:flex-none">
                        <button class="btn btn-secondary flex-1 md:flex-none md:w-36 md:py-[13px] whitespace-nowrap order-1" id="resetBtn">Clear</button>
                        <button class="btn btn-primary flex-1 md:flex-none md:w-36 md:py-[13px] whitespace-nowrap order-2" id="searchBtn">Find Results</button>
                    </div>
                </div>
                <div class="filter-control-row">
                    <div class="year-tabs-wrapper">
                        <div class="year-tabs-label">Filter By Year:</div>
                        <div class="year-tabs" id="yearTabsContainer">
                            <button class="year-tab" data-year="">All Years</button>
                        </div>
                    </div>
                    
                    <div class="stage-select-wrapper">
                        <div class="year-tabs-label">Filter By Stage:</div>
                        <select id="filterStage">
                            <option value="">All 14 Stages</option>
                        </select>
                    </div>
                </div>
            </div>

            <div id="metaContainer" style="display: none;" class="meta-info mb-6"></div>
            
            <div id="resultsContainer"></div>

        </div>
    </div>

    <footer id="global-footer" class="bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800"></footer>

    <script src="data.js"></script>
    <script src="backend_tools/club_mappings.js"></script>
    <script>
        const queryInput = document.getElementById('searchQuery');
        const stageSelect = document.getElementById('filterStage');
        const yearTabsContainer = document.getElementById('yearTabsContainer');
        const searchBtn = document.getElementById('searchBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const metaContainer = document.getElementById('metaContainer');

        let activeSelectedYear = "";
        let isYearTabClicked = false;

        const courseRecords = {
            "2026": {"1":"00:31:14","2":"00:38:40","3":"00:43:25","4":"00:36:12","5":"00:41:20","6":"00:33:15","7":"00:39:45","8":"00:42:10","9":"00:35:50","10":"00:38:15","11":"00:40:05","12":"00:37:20","13":"00:44:10","14":"00:31:55"},
            "2025": {"1":"00:34:14","2":"00:39:15","3":"00:44:50","4":"00:37:00","5":"00:42:55","6":"00:34:20","7":"01:20:00","12":"00:38:50","13":"00:45:30","14":"00:32:40"},
            "2024": {"1":"00:35:40","2":"00:40:20","3":"00:45:12","4":"00:38:10","5":"00:43:15","6":"00:35:05","7":"00:42:15","8":"00:44:55","9":"00:37:30","10":"00:40:45","11":"00:42:50","12":"00:39:15","13":"00:46:20","14":"00:33:10"}
        };

        const stageCutoffs = {
            "2026": {
                "1": "00:46:00", "2": "01:02:00", "3": "01:08:00", "4": "01:01:00",
                "5": "01:13:00", "6": "01:54:00", "7": "00:50:00", "8": "01:58:00",
                "9": "01:30:00", "10": "01:10:00", "11": "01:15:00", "12": "01:00:00",
                "13": "00:49:00", "14": "00:46:00"
            },
            "2025": {
                "1": "00:46:00", "2": "01:02:00", "3": "01:08:00", "4": "01:01:00",
                "5": "01:13:00", "6": "01:54:00", "7": "00:50:00", "8": "01:58:00",
                "9": "01:30:00", "10": "01:10:00", "11": "01:15:00", "12": "01:00:00",
                "13": "00:49:00", "14": "00:46:00"
            },
            "2024": {
                "1": "00:46:00", "2": "01:02:00", "3": "01:08:00", "4": "01:01:00",
                "5": "01:13:00", "6": "01:54:00", "7": "00:50:00", "8": "01:58:00",
                "9": "01:30:00", "10": "01:10:00", "11": "01:15:00", "12": "01:10:00",
                "13": "00:49:00", "14": "00:46:00"
            },
        };

        const uniqueYears = [...new Set([
            ...relayResults.map(r => r.year),
            ...Object.keys(courseRecords).map(Number)
        ])].sort((a, b) => b - a);        
        
        uniqueYears.forEach(year => {
            const btn = document.createElement('button');
            btn.className = 'year-tab';
            btn.textContent = year;
            btn.setAttribute('data-year', year);
            yearTabsContainer.appendChild(btn);
        });

        yearTabsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('year-tab')) {
                document.querySelectorAll('.year-tab').forEach(t => t.classList.remove('active'));
                e.target.classList.add('active');
                activeSelectedYear = e.target.getAttribute('data-year');
                isYearTabClicked = true; // Flag explicit user click execution context
                performSearch();
            }
        });

        const uniqueStages = [...new Set(relayResults.map(r => r.stage))].sort((a,b) => a-b);
        uniqueStages.forEach(s => { 
            stageSelect.options.add(new Option(`Stage ${s}`, s));
        });

        const defTimeToSeconds = (tStr) => {
            if (!tStr) return 0;
            const p = tStr.split(':');
            return parseInt(p[0],10) * 3600 + parseInt(p[1],10) * 60 + parseInt(p[2],10);
        };

        const formatPaceValue = (totalSeconds, distance) => {
            if (!distance || totalSeconds <= 0) return "-";
            const paceSecs = Math.round(totalSeconds / distance);
            const mins = Math.floor(paceSecs / 60);
            const secs = paceSecs % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        };

        window.saveArchiveState = function(athleteTarget) {
            const state = {
                year: activeSelectedYear,
                stage: stageSelect.value,
                search: queryInput.value,
                scrollPosition: window.scrollY,
                highlightAthlete: athleteTarget
            };
            sessionStorage.setItem('archive_view_state', JSON.stringify(state));
        };

        function cleanLabel(str) {
            return str ? str.replace(/\s*\([^)]+\)/g, '').trim() : '';
        }

        function showInitialWelcomeState() {
            metaContainer.style.display = "none";
            resultsContainer.innerHTML = `
                <div class="initial-state">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2" style="margin: 0 auto 12px auto;">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <p class="text-slate-400 text-sm m-0">Enter an athlete name, select a course stage, or pick an edition year above to query the archives.</p>
                </div>`;
        }

        function performSearch() {
            const searchTerm = queryInput.value.toLowerCase().trim();
            const selectedStage = stageSelect.value;
            const mappingsExist = typeof clubMappingsMaster !== 'undefined';

            // Check if user explicitly clicked a year tab or input field data
            if (searchTerm === "" && selectedStage === "" && activeSelectedYear === "" && !isYearTabClicked) {
                showInitialWelcomeState();
                return;
            }

            const filtered = relayResults.filter(row => {
                if (defTimeToSeconds(row.time) <= 0) return false;
                
                const rawClub = cleanLabel(row.club);
                const lookupKey = rawClub.toLowerCase().trim();
                const mappedClubName = mappingsExist ? (clubMappingsMaster[lookupKey] || rawClub) : rawClub;

                const matchesSearch = row.name.toLowerCase().includes(searchTerm) || 
                                      row.club.toLowerCase().includes(searchTerm) ||
                                      mappedClubName.toLowerCase().includes(searchTerm);
                                      
                const matchesYear = activeSelectedYear === "" || row.year.toString() === activeSelectedYear;
                const matchesStage = selectedStage === "" || row.stage.toString() === selectedStage;
                return matchesSearch && matchesYear && matchesStage;
            });

            metaContainer.style.display = "block";
            metaContainer.textContent = `Found ${filtered.length} matching record${filtered.length === 1 ? '' : 's'}.`;

            if (filtered.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="initial-state" style="border-style: solid;">
                        <p class="text-slate-400">No matching database records found. Please update your search criteria parameters.</p>
                    </div>`;
                return;
            }

            const groups = {};
            filtered.forEach(row => {
                if (!groups[row.year]) groups[row.year] = {};
                if (!groups[row.year][row.stage]) groups[row.year][row.stage] = [];
                groups[row.year][row.stage].push(row);
            });

            let htmlOutput = '';
            const sortedYears = Object.keys(groups).sort((a, b) => b - a);

            sortedYears.forEach(year => {
                htmlOutput += `<div class="year-heading">${year} Results</div>`;
                htmlOutput += `<div class="results-block">`;

                const sortedStages = Object.keys(groups[year]).sort((a, b) => a - b);
                sortedStages.forEach(stage => {
                    const stageRows = groups[year][stage];
                    const stageTitle = stageRows[0]?.stage_name || '';
                    const miles = stageRows[0]?.miles || null;
                    const km = stageRows[0]?.km || null;

                    const cutOffTime = (stageCutoffs[year] && stageCutoffs[year][stage]) ? stageCutoffs[year][stage] : null;
                    const standingRecord = courseRecords[year] ? courseRecords[year][stage] : null;
                    
                    let recordLabel = '';
                    if (standingRecord) {
                        recordLabel = `<span class="record-badge">Course Record: ${standingRecord}</span>`;
                    }

                    const cutoffLabel = cutOffTime ? `<span class="stage-cutoff cutoff-badge">Stage Cut Off: ${cutOffTime}</span>` : '';
                    
                    let distanceLabel = '';
                    if (miles && km) {
                        distanceLabel = `<span class="stage-distance">${miles} mi / ${km} km</span>`;
                    } else if (miles) {
                        distanceLabel = `<span class="stage-distance">${miles} mi</span>`;
                    }

                    htmlOutput += `<div class="stage-group">`;
                    htmlOutput += `<div class="stage-sticky-combine">`;
                    htmlOutput += `
                        <div class="stage-header-row">
                            <div class="stage-header-container">
                                <div class="stage-header-left">
                                    Stage ${stage} <span class="stage-title">${stageTitle}</span>
                                    ${distanceLabel}
                                    ${recordLabel}
                                </div>
                                ${cutoffLabel}
                            </div>
                        </div>
                        <div class="results-table-header hidden sm:grid">
                            <div>Pos</div>
                            <div>Name</div>
                            <div>Club</div>
                            <div>Time</div>
                            <div>Pace</div>
                        </div>`;
                    htmlOutput += `</div>`; 

                    stageRows.forEach((row, index) => {
                        const isWinner = row.position === 1;
                        const runSeconds = defTimeToSeconds(row.time);
                        
                        const missedCutoff = cutOffTime && runSeconds > defTimeToSeconds(cutOffTime);
                        const brokeRecord = standingRecord && runSeconds <= defTimeToSeconds(standingRecord);
                        
                        const milePace = formatPaceValue(runSeconds, miles);
                        const kmPace = formatPaceValue(runSeconds, km);
                        
                        let rowModifierClass = index % 2 === 0 ? 'results-row-strip-even' : 'results-row-strip-odd';
                        
                        if (missedCutoff) {
                            rowModifierClass += ' cutoff-row cutoff-row-border text-rose-200';
                        } else if (isWinner) {
                            rowModifierClass += ' winner-row winner-row-border';
                        }
                        
                        let timeMarkup = brokeRecord ? 
                            `<span class="record-breaker-time bg-emerald-950/80 border border-emerald-500 text-emerald-400 px-2 py-0.5 rounded text-sm font-bold inline-block">${row.time}</span>` : 
                            `<span>${row.time}</span>`;
                        
                        const rawClub = cleanLabel(row.club);
                        const lookupKey = rawClub.toLowerCase().trim();
                        const finalClubName = mappingsExist ? (clubMappingsMaster[lookupKey] || rawClub || 'Independent') : (rawClub || 'Independent');

                        htmlOutput += `
                            <div class="results-row ${rowModifierClass} grid grid-cols-[40px_1fr_95px] sm:block items-center py-3 sm:py-0">
                                <div class="cell-position sm:inline-block font-mono text-slate-400 font-bold">${row.position}</div>
                                <div class="cell-name sm:inline-block pl-2 sm:pl-0">
                                    <a href="athlete.html?name=${encodeURIComponent(row.name)}" onclick="saveArchiveState('${encodeURIComponent(row.name)}')" class="text-white hover:text-emerald-400 transition-colors block sm:inline" style="font-weight: 600;">${row.name}</a>
                                    <span class="sm:hidden block text-xs text-slate-400 font-medium mt-0.5">
                                        <a href="club.html?club=${encodeURIComponent(finalClubName)}" class="hover:underline">${finalClubName}</a>
                                    </span>
                                    <span class="sm:hidden block text-xs text-slate-400 font-mono mt-1">
                                        Pace: <strong class="text-white font-bold">${milePace}</strong>/mi · <span class="text-slate-300">${kmPace}</span>/km
                                    </span>
                                </div>
                                <div class="cell-club hidden sm:inline-block"><a href="club.html?club=${encodeURIComponent(finalClubName)}" class="hover:text-emerald-400 transition-colors">${finalClubName}</a></div>
                                <div class="cell-time text-right sm:text-left font-mono pr-2 sm:pr-0">${timeMarkup}</div>
                                <div class="cell-pace hidden sm:inline-block">
                                    <strong>${milePace}</strong> <span>/mi</span>
                                    <span class="pace-subtext">${kmPace} /km</span>
                                </div>
                            </div>`;
                    });

                    htmlOutput += `</div>`; 
                });

                htmlOutput += `</div>`;
            });

            resultsContainer.innerHTML = htmlOutput;
        }

        searchBtn.addEventListener('click', () => {
            isYearTabClicked = true; 
            performSearch();
        });
        
        stageSelect.addEventListener('change', () => {
            isYearTabClicked = true;
            performSearch();
        });
        
        queryInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { 
                isYearTabClicked = true;
                performSearch(); 
            }
        });

        resetBtn.addEventListener('click', () => {
            queryInput.value = "";
            stageSelect.value = "";
            activeSelectedYear = "";
            isYearTabClicked = false;
            document.querySelectorAll('.year-tab').forEach(t => t.classList.remove('active'));
            const allYearsTab = document.querySelector('.year-tab[data-year=""]');
            if (allYearsTab) allYearsTab.classList.add('active');
            showInitialWelcomeState();
        });

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const urlYear = params.get('year');
            const urlStage = params.get('stage');

            if (urlYear || urlStage) {
                isYearTabClicked = true;
                if (urlYear) {
                    activeSelectedYear = urlYear;
                    document.querySelectorAll('.year-tab').forEach(t => t.classList.remove('active'));
                    const targetTab = document.querySelector(`.year-tab[data-year="${urlYear}"]`);
                    if (targetTab) targetTab.classList.add('active');
                }
                if (urlStage) stageSelect.value = urlStage;
                performSearch();
                return;
            }

            const savedStateStr = sessionStorage.getItem('archive_view_state');
            if (savedStateStr) {
                const state = JSON.parse(savedStateStr);
                sessionStorage.removeItem('archive_view_state');

                activeSelectedYear = state.year;
                stageSelect.value = state.stage;
                queryInput.value = state.search;
                isYearTabClicked = true;

                document.querySelectorAll('.year-tab').forEach(t => t.classList.remove('active'));
                const targetTab = document.querySelector(`.year-tab[data-year="${state.year}"]`);
                if (targetTab) targetTab.classList.add('active');

                performSearch();

                setTimeout(() => {
                    window.scrollTo({ top: state.scrollPosition, behavior: 'instant' });
                }, 50);
            } else {
                const allYearsTab = document.querySelector('.year-tab[data-year=""]');
                if (allYearsTab) allYearsTab.classList.add('active');
                showInitialWelcomeState();
            }
        });
    </script>
</body>
</html>
