<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-Time Records - Rack Raid Archive</title>
    <!-- Include Tailwind for the global components to use -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Link to our tidy external styles sheet -->
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <!-- Load the layout loader module script -->
    <script src="site-layout.js"></script>
</head>
<body class="stats-dashboard-page bg-slate-950 min-h-screen flex flex-col text-slate-100">

    <!-- Global Header Component Wrapper Box -->
    <header id="global-header" class="w-full bg-slate-900 border-b border-slate-800"></header>

    <div class="page-wrapper flex-grow !pt-6">
        <div class="content-container">

            <a href="index.html" onclick="window.history.back(); return false;" class="inline-flex items-center gap-1.5 text-slate-400 hover:text-slate-100 font-semibold no-underline mb-6 transition-colors text-sm">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Back to Results Archive
            </a>

            <main class="main-profile-container">
                
                <div class="bg-slate-900 text-white rounded-lg p-8 mb-8 text-center border border-slate-800">
                    <h1 class="text-3xl font-black uppercase tracking-tight m-0 leading-none">Event-Wide Records</h1>
                    <p class="text-slate-400 font-medium text-sm mt-2 mb-0">Historical statistics and hall of fame benchmarks across all compiled race chapters</p>
                </div>

                <!-- HIGHLIGHT BOXES OVERVIEW -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div id="topRunnerWins" class="stat-value">-</div>
                        <div id="topRunnerName" class="stat-meta" style="font-size: 0.875rem; color: #34d399; font-weight: 700; margin-top: 0.25rem;">-</div>
                        <div class="stat-label" style="margin-top: 0.25rem;">Most Individual Wins</div>
                    </div>
                    <div class="stat-card">
                        <div id="topClubWins" class="stat-value">-</div>
                        <div id="topClubName" class="stat-meta" style="font-size: 0.875rem; color: #34d399; font-weight: 700; margin-top: 0.25rem;">-</div>
                        <div class="stat-label" style="margin-top: 0.25rem;">Most Club Wins</div>
                    </div>
                    <div class="stat-card">
                        <div id="topLoyaltyRunner" class="stat-value">-</div>
                        <div id="topLoyaltyName" class="stat-meta" style="font-size: 0.875rem; color: #34d399; font-weight: 700; margin-top: 0.25rem;">-</div>
                        <div class="stat-label" style="margin-top: 0.25rem;">Most Stages Logged</div>
                    </div>
                    <div class="stat-card">
                        <div id="totalRecordsBroken" class="stat-value">0</div>
                        <div class="stat-meta" style="font-size: 0.875rem; color: #94a3b8; font-weight: 500; margin-top: 0.25rem;">Event History</div>
                        <div class="stat-label" style="margin-top: 0.25rem;">Records Broken All-Time</div>
                    </div>
                </div>

                <!-- MAIN DASHBOARD CONTENT TABLES -->
                <div class="dashboard-grid grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="dynamic-dashboard-grid">
                    <!-- Athlete, Club, and Stage cards will generate dynamically here in your exact order -->
                </div>

            </main>
        </div>
    </div>

    <!-- Global Footer Wrapper Element -->
    <footer id="global-footer" class="bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800"></footer>

    <script src="data.js"></script>
    <script src="backend_tools/club_mappings.js"></script>
    <script src="backend_tools/series_winners.js"></script>
<script>
    const defTimeToSeconds = (tStr) => {
        if (!tStr) return 0;
        const p = tStr.split(':');
        if (p.length < 3) return 0;
        return parseInt(p[0],10) * 3600 + parseInt(p[1],10) * 60 + parseInt(p[2],10);
    };

    document.addEventListener("DOMContentLoaded", function() {
        if (typeof relayResults === 'undefined') {
            console.error("relayResults data array is missing.");
            return;
        }

        const activeMappings = typeof clubMappingsMaster !== 'undefined' ? clubMappingsMaster : {};

        const cleanClubName = (rawString) => {
            if (!rawString) return "Independent";
            
            let val = rawString.toString().trim();
            
            // 1. Strip trailing team letters like " A", " B", " C" or bracketed variants like " (A)", " (B)"
            val = val.replace(/\s*[\(\s]([A-D]|\d+)挂*$/, '').trim();
            
            // 2. Standardise suffix clean-up variations
            val = val.replace(/\s*Running Club$/i, '')
                    .replace(/\s*RC$/i, '')
                    .replace(/\s*Harriers挂$/i, '')
                    .replace(/\s*Roadents挂$/i, '')
                    .replace(/\s*Runners$/i, '')
                    .trim();
                    
            let lookupKey = val.toLowerCase();

            // 3. Match against your master dictionary translations
            if (activeMappings[lookupKey]) return activeMappings[lookupKey];
            if (activeMappings[val]) return activeMappings[val];

            if (val === '-' || lookupKey === 'individual' || lookupKey === 'unattached' || lookupKey === 'independent') {
                return 'Independent';
            }
            
            // Return a beautifully polished title-case fallback if not in dictionary
            return val;
        };

        const runnerData = {};
        const clubWins = {};

        // Track appearances per stage per runner: { "Runner Name": { 1: 3, 2: 5 ... } }
        const stageStalwarts = {};

        relayResults.forEach(row => {
            if (!row || !row.name) return;

            const athleteName = row.name.toString().replace(/\s*\([MF]\d*\)\s*$/, '').trim();
            if (!athleteName || athleteName === '-') return;

            const upperName = athleteName.toUpperCase();
            if (upperName === 'DNF' || upperName === 'DNS' || upperName.includes("RUNNER")) return;

            const clubName = cleanClubName(row.club);
            const stageNum = parseInt(row.stage, 10);
            const positionNum = parseInt(row.position, 10);

            // 1. Club Victories (Include Unknown)
            if (!clubWins[clubName]) {
                clubWins[clubName] = { club: clubName, wins: 0 };
            }
            if (positionNum === 1) {
                clubWins[clubName].wins++;
            }

            // 2. Athlete Records (Exclude Unknown)
            if (upperName !== 'UNKNOWN') {
                if (!runnerData[athleteName]) {
                    runnerData[athleteName] = { name: athleteName, runs: 0, wins: 0 };
                }
                runnerData[athleteName].runs++;
                if (positionNum === 1) {
                    runnerData[athleteName].wins++;
                }

                // Track individual stage appearances
                if (!stageStalwarts[athleteName]) {
                    stageStalwarts[athleteName] = {};
                }
                stageStalwarts[athleteName][stageNum] = (stageStalwarts[athleteName][stageNum] || 0) + 1;
            }
        });

        // Prepare sorted data structures
        const runnersArray = Object.values(runnerData);
        const clubWinsSorted = Object.values(clubWins).filter(c => c.wins > 0 && c.club !== 'Independent').sort((a,b) => b.wins - a.wins);

        const loyaltySorted = [...runnersArray].sort((a,b) => b.runs - a.runs).slice(0, 5);
        const athleteWinsSorted = [...runnersArray].filter(r => r.wins > 0).sort((a,b) => b.wins - a.wins).slice(0, 5);

        // Define dashboard card sequence configuration
        const cardConfigs = [
            {
                type: 'athlete-loyalty',
                title: 'Most Stages Completed (All-Time)',
                data: loyaltySorted,
                render: (r, idx) => `
                    <div class="row-item flex justify-between items-center py-2 border-b border-slate-800/50 text-sm">
                        <div><span class="font-mono text-slate-500 mr-2">${idx+1}.</span><a href="athlete.html?name=${encodeURIComponent(r.name)}" class="hover:text-emerald-400 transition font-medium">${r.name}</a></div>
                        <div class="bg-slate-800 text-slate-300 px-2 py-0.5 rounded text-xs font-mono">${r.runs} Stages</div>
                    </div>`
            },
            {
                type: 'athlete-wins',
                title: 'Most Individual Stage Wins',
                data: athleteWinsSorted,
                render: (r, idx) => `
                    <div class="row-item flex justify-between items-center py-2 border-b border-slate-800/50 text-sm">
                        <div><span class="font-mono text-slate-500 mr-2">${idx+1}.</span><a href="athlete.html?name=${encodeURIComponent(r.name)}" class="hover:text-emerald-400 transition font-medium">${r.name}</a></div>
                        <div class="bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded text-xs font-mono font-bold">${r.wins} Wins</div>
                    </div>`
            },
            {
                type: 'club-wins',
                title: 'Most Stage Wins by Club',
                data: clubWinsSorted.slice(0, 5),
                render: (c, idx) => `
                    <div class="row-item flex justify-between items-center py-2 border-b border-slate-800/50 text-sm">
                        <div><span class="font-mono text-slate-500 mr-2">${idx+1}.</span><a href="club.html?club=${encodeURIComponent(c.club)}" class="hover:text-emerald-400 transition font-medium">${c.club}</a></div>
                        <div class="bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded text-xs font-mono font-bold">${c.wins} Wins</div>
                    </div>`
            },
{
                type: 'team-championships',
                title: 'Most Overall Team Championships',
                placeholder: true,
                html: (() => {
                    const activeWinners = typeof seriesWinnersMaster !== 'undefined' ? seriesWinnersMaster : [];
                    const champCounts = {};

                    // Aggregate the wins using our standardised master file names
                    activeWinners.forEach(record => {
                        const clubName = cleanClubName(record.club);
                        champCounts[clubName] = (champCounts[clubName] || 0) + 1;
                    });

                    // Sort descending by total championships won
                    const sortedChamps = Object.entries(champCounts)
                        .sort((a, b) => b[1] - a[1])
                        .slice(0, 5);

                    if (sortedChamps.length === 0) {
                        return `<div style="padding: 15px 0; text-align: center; color: #94a3b8; font-style: italic;">No championship data compiled.</div>`;
                    }

                    let htmlOutput = '';
                    sortedChamps.forEach(([club, count], idx) => {
                        htmlOutput += `
                            <div class="row-item">
                                <div><span class="rank-num">${idx+1}.</span><a href="club.html?club=${encodeURIComponent(club)}">${club}</a></div>
                                <div class="count-badge">${count} Titles</div>
                            </div>`;
                    });
                    return htmlOutput;
                })()
            },
            // Stage Stalwart sub-grid layouts
            { type: 'stage', stageNum: 1, title: 'Stage 1 Stalwarts', badge: 'Early Riser' },
            { type: 'stage', stageNum: 2, title: 'Stage 2 Stalwarts' },
            { type: 'stage', stageNum: 3, title: 'Stage 3 Stalwarts' },
            { type: 'stage', stageNum: 4, title: 'Stage 4 Stalwarts' },
            { type: 'stage', stageNum: 5, title: 'Stage 5 Stalwarts' },
            { type: 'stage', stageNum: 6, title: 'Stage 6 Stalwarts' },
            { type: 'stage', stageNum: 7, title: 'Stage 7 Stalwarts' },
            { type: 'stage', stageNum: 8, title: 'Stage 8 Stalwarts', badge: 'Longest Stage' },
            { type: 'stage', stageNum: 9, title: 'Stage 9 Stalwarts' },
            { type: 'stage', stageNum: 10, title: 'Stage 10 Stalwarts' },
            { type: 'stage', stageNum: 11, title: 'Stage 11 Stalwarts', badge: 'Pub Finish' },
            { type: 'stage', stageNum: 12, title: 'Stage 12 Stalwarts' },
            { type: 'stage', stageNum: 13, title: 'Stage 13 Stalwarts', badge: 'That Hill!' },
            
            // --- STAGE 14 NEXT YEAR GENERATION CONFIGURATION TARGET ---
            // Uncomment the object below next year to instantly slot it into the layout engine
            /*
            { type: 'stage', stageNum: 14, title: 'Stage 14 Stalwarts' }
            */
        ];

        // Core compilation generator loop
        const gridContainer = document.getElementById('dynamic-dashboard-grid');
        if (!gridContainer) return;

        let dynamicHtml = '';

        cardConfigs.forEach(card => {
            // Keep your native semantic structure so styles.css handles formatting perfectly
            dynamicHtml += `
                <div class="section-box">
                    <h2>
                        ${card.title}
                        ${card.badge ? `<span class="chip-special">${card.badge}</span>` : ''}
                    </h2>`;

            if (card.placeholder) {
                dynamicHtml += card.html;
            } else if (card.type === 'stage') {
                const stageList = Object.keys(stageStalwarts)
                    .map(name => ({ name, count: stageStalwarts[name][card.stageNum] || 0 }))
                    .filter(item => item.count > 0)
                    .sort((a, b) => b.count - a.count)
                    .slice(0, 5);

                if (stageList.length > 0) {
                    stageList.forEach((r, idx) => {
                        dynamicHtml += `
                            <div class="row-item">
                                <div><span class="rank-num">${idx+1}.</span><a href="athlete.html?name=${encodeURIComponent(r.name)}">${r.name}</a></div>
                                <div class="count-badge">${r.count} Times</div>
                            </div>`;
                    });
                } else {
                    dynamicHtml += `<div style="padding: 15px 0; text-align: center; color: #94a3b8; font-style: italic;">No entries logged for this leg.</div>`;
                }
            } else {
                if (card.data && card.data.length > 0) {
                    card.data.forEach((item, idx) => {
                        dynamicHtml += card.render(item, idx);
                    });
                } else {
                    dynamicHtml += `<div style="padding: 15px 0; text-align: center; color: #94a3b8; font-style: italic;">No data records compiled.</div>`;
                }
            }

            dynamicHtml += `
                </div>`;
        });

        gridContainer.innerHTML = dynamicHtml;

        // Set Top Overview Header Badges using computed variables
        const topLoyaltyRunnerEl = document.getElementById('topLoyaltyRunner');
        const topLoyaltyNameEl = document.getElementById('topLoyaltyName');
        if (topLoyaltyRunnerEl) topLoyaltyRunnerEl.textContent = loyaltySorted[0] ? `${loyaltySorted[0].runs} Legs` : '-';
        if (topLoyaltyNameEl) topLoyaltyNameEl.textContent = loyaltySorted[0] ? loyaltySorted[0].name : '-';

        const topRunnerWinsEl = document.getElementById('topRunnerWins');
        const topRunnerNameEl = document.getElementById('topRunnerName');
        if (topRunnerWinsEl) topRunnerWinsEl.textContent = athleteWinsSorted[0] ? `${athleteWinsSorted[0].wins} Wins` : '-';
        if (topRunnerNameEl) topRunnerNameEl.textContent = athleteWinsSorted[0] ? athleteWinsSorted[0].name : '-';

        const topClubWinsEl = document.getElementById('topClubWins');
        const topClubNameEl = document.getElementById('topClubName');
        if (topClubWinsEl) topClubWinsEl.textContent = clubWinsSorted[0] ? `${clubWinsSorted[0].wins} Wins` : '-';
        if (topClubNameEl) topClubNameEl.textContent = clubWinsSorted[0] ? clubWinsSorted[0].club : '-';
    });
</script>
</body>
</html>
