<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Profile | Rack Raid Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <script src="site-layout.js"></script>
    <script src="data/course_records.js"></script>
    <script src="backend_tools/club_mappings.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="stage-details-page bg-slate-950 min-h-screen flex flex-col text-slate-100">

    <div class="w-full bg-slate-900 border-b border-slate-800">
        <header id="global-header" class="text-white"></header>
    </div>

<div class="w-full bg-slate-950 min-h-[260px] sm:min-h-[320px] md:min-h-[360px] relative overflow-hidden flex items-center py-6">
    <img id="banner-img" class="absolute inset-0 w-full h-full object-cover opacity-45 mix-blend-luminosity brightness-75" alt="Stage background">
    <div class="absolute inset-0 bg-gradient-to-b from-slate-950/40 via-slate-900/80 to-slate-950"></div>
    
    <div class="max-w-[1400px] mx-auto w-full px-4 relative z-10 flex flex-col justify-center">
            <h2 class="text-emerald-400 font-black text-2xl tracking-tight uppercase mb-1" id="stage-number-title">Stage --</h2>
            <h3 class="text-white font-black text-3xl md:text-5xl uppercase tracking-tight leading-none mb-4" id="stage-location-title">Loading Route...</h3>
            
            <div class="flex flex-col sm:flex-row gap-4">
                <div class="flex items-center gap-4 bg-slate-900/60 border border-slate-700/50 rounded-xl px-4 py-3 backdrop-blur-sm w-max shadow-lg">
                    <div class="bg-emerald-500/20 text-emerald-400 font-mono font-black text-xl px-3 py-1 rounded-lg tracking-tight" id="banner-record-time">
                        --:--:--
                    </div>
                    <div class="text-xs md:text-sm font-medium text-slate-300">
                        <span class="text-slate-400 font-bold uppercase tracking-wider block text-[10px]">Overall Record</span>
                        <span id="banner-record-holder" class="text-white font-bold">Loading...</span>
                    </div>
                </div>

                <div id="female-record-panel" class="hidden flex items-center gap-4 bg-slate-900/60 border border-slate-700/50 rounded-xl px-4 py-3 backdrop-blur-sm w-max shadow-lg">
                    <div class="bg-pink-500/20 text-pink-400 font-mono font-black text-xl px-3 py-1 rounded-lg tracking-tight" id="banner-female-record-time">
                        --:--:--
                    </div>
                    <div class="text-xs md:text-sm font-medium text-slate-300">
                        <span class="text-pink-400 font-bold uppercase tracking-wider block text-[10px]">Female Record</span>
                        <span id="banner-female-record-holder" class="text-white font-bold">Loading...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <main class="max-w-[1400px] mx-auto w-full px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8 flex-grow">
        
        <div class="lg:col-span-2 flex flex-col gap-6">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 bg-[#1e293b] p-5 rounded-xl shadow-sm border border-[#334155]">
                <div class="text-center border-r border-[#334155] last:border-0">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Distance</span>
                    <span class="text-2xl font-black text-slate-100" id="stat-distance">--</span> <span class="text-sm font-bold text-slate-400">mi</span>
                </div>
                <div class="text-center sm:border-r border-[#334155] last:border-0">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Elevation Gain</span>
                    <span class="text-2xl font-black text-slate-100" id="stat-elevation">--</span> <span class="text-sm font-bold text-slate-400">m</span>
                </div>
                <div class="text-center border-r border-[#334155] last:border-0">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Toughness</span>
                    <span class="text-2xl font-black text-amber-500" id="stat-toughness">--</span><span class="text-sm font-bold text-slate-500">/5</span>
                </div>
                <div class="text-center last:border-0">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider block mb-1">Course Record</span>
                    <span class="text-xl font-black text-emerald-400 block mt-1 leading-none" id="stat-record">--:--:--</span>
                </div>
            </div>

            <div class="bg-[#1e293b] p-3 rounded-xl shadow-sm border border-[#334155]">
                <div id="map" class="shadow-inner"></div>
            </div>

            <div class="bg-[#1e293b] p-6 rounded-xl shadow-sm border border-[#334155] flex flex-col gap-4">
                <div>
                    <h3 class="font-black uppercase tracking-tight text-sm text-slate-400 tracking-wider mb-2">Course Dispatch</h3>
                    <p class="text-slate-300 leading-relaxed text-sm" id="stage-description">No route details documented for this stage variant yet.</p>
                </div>
                <div class="border-t border-[#334155] pt-4 mt-2">
                    <h4 class="font-bold uppercase tracking-tight text-xs text-slate-400 mb-1">Local Trivia & Facts</h4>
                    <p class="text-slate-300 text-sm italic" id="stage-facts">Information arriving shortly.</p>
                </div>
            </div>
        </div>

        <div class="flex flex-col gap-4" id="accordion-container"></div>
    </main>

    <footer id="global-footer" class="bg-slate-900 text-slate-400 text-xs py-6 border-t border-slate-800"></footer>

    <script src="stages.js"></script>
    <script src="data.js"></script>
    <script>
        const stageNames = {
            1: "Grosmont to Skenfrith", 2: "Skenfrith to White Castle", 3: "White Castle to Abergavenny",
            4: "Abergavenny to Old Court Moat", 5: "Old Court Moat to Monmouth", 6: "Monmouth to Raglan",
            7: "Raglan to Usk", 8: "Usk to Tintern", 9: "Tintern to Chepstow", 10: "Chepstow to Caldicot",
            11: "Caldicot to Penhow", 12: "Penhow to Caerleon", 13: "Caerleon to Castell-y-Bwch",
            14: "Castell-y-Bwch to Olive Tree"
        };

        const urlParams = new URLSearchParams(window.location.search);
        const stageId = parseInt(urlParams.get('stage')) || 1;

        function cleanLabel(str) {
            return str ? str.replace(/\s*\([^)]+\)/g, '').trim() : '';
        }

        window.toggleAccordion = function(year) {
            const block = document.getElementById(`content-${year}`);
            const arrow = document.getElementById(`arrow-${year}`);
            if (!block) return;

            if (block.classList.contains('open')) {
                block.classList.remove('open');
                if (arrow) arrow.style.transform = 'rotate(0deg)';
            } else {
                block.classList.add('open');
                if (arrow) arrow.style.transform = 'rotate(180deg)';
            }
        };

        document.addEventListener("DOMContentLoaded", async function() {
            // Fire global folder randomizer script right away on setup
            if (typeof initializeRandomBanner === 'function') {
                initializeRandomBanner('banner-img');
            }

            const profile = stageProfiles[stageId];
            if (!profile) return;

            document.getElementById('stage-number-title').innerText = `Stage ${stageId}`;
            document.getElementById('stage-location-title').innerText = stageNames[stageId] || `Track ${stageId}`;
            document.getElementById('stat-distance').innerText = profile.distanceMiles;
            document.getElementById('stat-elevation').innerText = profile.elevationGainMetres;
            document.getElementById('stat-toughness').innerText = profile.toughness;
            
            if(profile.description) document.getElementById('stage-description').innerText = profile.description;
            if(profile.facts) document.getElementById('stage-facts').innerText = profile.facts;

            const clubMappings = typeof clubMappingsMaster !== 'undefined' ? clubMappingsMaster : {};

            function loadVerifiedRecords(stageId, clubMappings) {
                if (typeof courseRecordsMaster === 'undefined') return;

                const currentStageRecord = courseRecordsMaster.find(r => r.stage === stageId);

                if (currentStageRecord) {
                    const overall = currentStageRecord.overall_record;
                    const mappedOverallClub = clubMappings[overall.club.toLowerCase().trim()] || overall.club;

                    document.getElementById('stat-record').innerText = overall.time;
                    document.getElementById('banner-record-time').innerText = overall.time;
                    document.getElementById('banner-record-holder').innerText = `${overall.runner} (${mappedOverallClub} ${overall.year})`;

                    if (currentStageRecord.female_record) {
                        const female = currentStageRecord.female_record;
                        const mappedFemaleClub = clubMappings[female.club.toLowerCase().trim()] || female.club;

                        document.getElementById('banner-female-record-time').innerText = female.time;
                        document.getElementById('banner-female-record-holder').innerText = `${female.runner} (${mappedFemaleClub} ${female.year})`;
                        document.getElementById('female-record-panel').classList.remove('hidden');
                    }
                }
            }

            loadVerifiedRecords(stageId, clubMappings);

            if (typeof relayResults === 'undefined') return;
            const stageEntries = relayResults.filter(r => parseInt(r.stage, 10) === stageId);
            const trackingYears = [...new Set(stageEntries.map(r => parseInt(r.year, 10)))].sort((a, b) => b - a);

            const accordionWrapper = document.getElementById('accordion-container');
            let structuralBuffer = '';

            trackingYears.forEach((year, index) => {
                const yearHistory = stageEntries.filter(r => parseInt(r.year, 10) === year).sort((a, b) => a.time.localeCompare(b.time));
                const isOpenByDefault = index === 0;

                structuralBuffer += `
                    <div class="bg-[#1e293b] rounded-xl border border-[#334155] shadow-sm overflow-hidden">
                        <button onclick="window.toggleAccordion(${year})" class="w-full text-left p-5 flex justify-between items-center font-black uppercase tracking-tight text-lg text-slate-100 border-b border-[#334155] bg-slate-900/30 hover:bg-slate-900/60 transition-colors">
                            <div class="flex items-center gap-4">
                                <span>${year} Stage Standings</span>
                                <span class="text-xs text-slate-400 font-bold bg-slate-800 px-2 py-1 rounded normal-case tracking-normal">${yearHistory.length} Finishes</span>
                            </div>
                            <svg id="arrow-${year}" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" class="text-slate-400 transition-transform duration-200" style="transform: ${isOpenByDefault ? 'rotate(180deg)' : 'rotate(0deg)'};">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        
                        <div id="content-${year}" class="accordion-content ${isOpenByDefault ? 'open' : ''} overflow-y-auto custom-scrollbar px-5" style="${isOpenByDefault ? 'max-height: 550px;' : ''}">
                            <div class="py-4">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="text-slate-400 uppercase text-[10px] font-bold tracking-wider border-b border-[#334155]">
                                            <th class="pb-2 w-10">Pos</th>
                                            <th class="pb-2">Runner</th>
                                            <th class="pb-2 text-right">Time</th>
                                        </tr>
                                    </thead>
                                    <tbody class="text-sm font-medium text-slate-300 divide-y divide-[#334155]">
                                        ${yearHistory.map((r, idx) => {
                                            const rawClub = cleanLabel(r.club);
                                            const mappedClub = clubMappings[rawClub.toLowerCase().trim()] || rawClub || 'Independent';
                                            const runnerName = cleanLabel(r.name);
                                            return `
                                                <tr class="hover:bg-slate-800/40 transition-colors">
                                                    <td class="py-3 font-bold text-slate-500">${idx + 1}</td>
                                                    <td class="py-3">
                                                        <a href="athlete.html?name=${encodeURIComponent(runnerName)}" class="block font-bold text-slate-100 hover:text-emerald-400 transition-colors no-underline">${runnerName}</a>
                                                        <span class="block text-xs text-slate-400 font-semibold">${mappedClub}</span>
                                                    </td>
                                                    <td class="py-3 text-right font-mono font-bold text-slate-100">${r.time}</td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            });

            accordionWrapper.innerHTML = structuralBuffer;

            if (profile.simplifiedRoute && profile.simplifiedRoute.length > 0) {
                const map = L.map('map');
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

                const polyline = L.polyline(profile.simplifiedRoute, { color: '#10b981', weight: 5, opacity: 0.9 }).addTo(map);
                map.fitBounds(polyline.getBounds(), { padding: [40, 40] });

                L.circleMarker(profile.simplifiedRoute[0], { radius: 6, color: '#ffffff', fillColor: '#10b981', fillOpacity: 1, weight: 3 }).addTo(map).bindPopup("<strong>Start Handover Point</strong>");
                L.circleMarker(profile.simplifiedRoute[profile.simplifiedRoute.length - 1], { radius: 6, color: '#ffffff', fillColor: '#ef4444', fillOpacity: 1, weight: 3 }).addTo(map).bindPopup("<strong>Finish Handover Point</strong>");
            }
        });
    </script>
</body>
</html>
